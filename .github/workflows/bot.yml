name: Run Deals Bot

on:
  schedule:
    # Runs every 15 minutes at off-peak minute intervals
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Deals Bot
        run: python deals_bot.py

      - name: Save posted deals history back to Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_deals.txt
          git commit -m "Saved new deals history" || echo "No new deals to save"
          git pull --rebase origin main
          git push
