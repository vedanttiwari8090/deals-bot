name: Deals Bot Workflow

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch: # This keeps the "Run workflow" button for manual testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows GitHub to save the updated history file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deals Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INR_ID: ${{ secrets.INR_ID }}
        run: |
          python deals_bot.py

      - name: Commit and Push History File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_deals.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update deals history"
          git push
